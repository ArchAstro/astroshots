name: Astroshots
options:
  bundleIdPrefix: ai.archastro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# MLX Audio Swift (Qwen3-TTS) → pulls mlx-swift, mlx-swift-lm, Hub client.
# Sparkle → in-app auto-updates from the GitHub Releases appcast.
packages:
  mlx-audio-swift:
    url: https://github.com/Blaizzy/mlx-audio-swift
    branch: main
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CURRENT_PROJECT_VERSION: "22"
    MARKETING_VERSION: "0.2.5"

targets:
  Astroshots:
    type: application
    platform: macOS
    sources:
      - path: Astroshots
        excludes:
          - "**/Resources/narration_harness.py"
    dependencies:
      - package: mlx-audio-swift
        product: MLXAudioCore
      - package: mlx-audio-swift
        product: MLXAudioTTS
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Astroshots/Astroshots.entitlements
    info:
      path: Astroshots/Info.plist
      properties:
        CFBundleDisplayName: Astroshots
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 ArchAstro Inc."
        # Menu-bar app: no Dock icon.
        LSUIElement: true
        # Sparkle feed must NOT use releases/latest — this repo has dual tracks
        # (macOS v* and npm astroshot-v*), and GitHub “Latest” is often npm.
        # CI keeps a dedicated non-latest `appcast` release with the cumulative feed.
        SUFeedURL: https://github.com/ArchAstro/astroshots/releases/download/appcast/appcast.xml
        SUPublicEDKey: kddwW0gHUJ6CvdcYukaQd+cfNxEEHwQZHjzUYsjtVgc=
        # Ask once (second launch) whether to check automatically; default yes.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.archastro.Astroshots
      configs:
        # Ad-hoc Debug + Hardened Runtime blocks loading the Sparkle framework
        # under Library Validation; Apple Development / Developer ID are fine.
        Debug:
          ENABLE_LIBRARY_VALIDATION: NO

  AstroshotsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AstroshotsTests
    dependencies:
      - target: Astroshots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AstroshotsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - AstroshotsUITests
    dependencies:
      - target: Astroshots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Astroshots:
    build:
      targets:
        Astroshots: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AstroshotsTests

  AstroshotsReviewUITests:
    build:
      targets:
        Astroshots: all
        AstroshotsUITests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AstroshotsUITests
