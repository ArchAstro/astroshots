name: Cut npm release

# Manually trigger from the Actions tab to:
#   1. Bump all three @archastro/* packages to the same version
#   2. Roll CHANGELOG.md Unreleased → ## [X.Y.Z] (npm)
#   3. Push tag astroshot-vX.Y.Z
#   4. Explicitly dispatch Publish npm package (GITHUB_TOKEN tag pushes do
#      not trigger other workflows)
#   5. Open a PR back to main so main tracks the bump
#
# Same shape as archastro-js release.yml. First-time publish still requires
# a manual bootstrap + npm trust github (see README / GO-LIVE-CHECKLIST).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version, e.g. 0.1.1 (overrides bump when set)"
        required: false
        type: string

concurrency:
  group: cut-npm-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cut-npm-release:
    name: Bump + branch + tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CUR="$(node -p "require('./packages/astroshot/package.json').version")"
          for directory in packages/react-shot packages/tui-shot packages/astroshot; do
            package_version="$(node -p "require('./${directory}/package.json').version")"
            if [[ "$package_version" != "$CUR" ]]; then
              echo "Package versions are not aligned ($directory=$package_version, astroshot=$CUR)" >&2
              exit 1
            fi
          done

          if [[ -n "${VERSION_INPUT// }" ]]; then
            NEXT="${VERSION_INPUT#v}"
            NEXT="${NEXT#astroshot-v}"
          else
            IFS='.' read -r MAJ MIN PAT <<<"${CUR%%-*}"
            case "$BUMP" in
              major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN + 1)); PAT=0 ;;
              patch) PAT=$((PAT + 1)) ;;
              *) echo "Invalid bump: $BUMP" >&2; exit 1 ;;
            esac
            NEXT="$MAJ.$MIN.$PAT"
          fi

          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Computed version is not valid semver: $NEXT" >&2
            exit 1
          fi
          if [[ "$NEXT" == "$CUR" ]]; then
            echo "Next version equals current ($CUR); nothing to release" >&2
            exit 1
          fi
          if git rev-parse "astroshot-v$NEXT" >/dev/null 2>&1; then
            echo "Tag astroshot-v$NEXT already exists" >&2
            exit 1
          fi

          TAG="astroshot-v$NEXT"
          BRANCH="release/$TAG"

          {
            echo "current=$CUR"
            echo "next=$NEXT"
            echo "tag=$TAG"
            echo "branch=$BRANCH"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Cut npm release"
            echo ""
            echo "- Packages: \`$CUR\` → \`$NEXT\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Tag: \`$TAG\`"
            echo "- Publish: explicit **Publish npm package** dispatch after the tag"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Bump packages + changelog on release branch
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git checkout -b "$BRANCH"
          npm run version:packages -- "$NEXT"
          node scripts/roll-changelog.mjs "$NEXT" --track npm
          git add \
            packages/react-shot/package.json \
            packages/tui-shot/package.json \
            packages/astroshot/package.json \
            package-lock.json \
            CHANGELOG.md
          git commit -m "release: npm $TAG"
          git push origin "$BRANCH"

      - name: Create + push tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release @archastro/astroshot ${TAG#astroshot-v}"
          git push origin "$TAG"

      - name: Dispatch Publish npm package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run "Publish npm package" \
            --repo "${{ github.repository }}" \
            --ref "$TAG"
          echo "Dispatched Publish npm package for $TAG" >>"$GITHUB_STEP_SUMMARY"

      - name: Open PR back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TAG: ${{ steps.bump.outputs.tag }}
          CUR: ${{ steps.bump.outputs.current }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Automated npm release branch cut by **Cut npm release**.

          | | |
          |--|--|
          | Version | \`$CUR\` → \`$NEXT\` |
          | Tag | \`$TAG\` |
          | Packages | \`@archastro/react-shot\`, \`@archastro/tui-shot\`, \`@archastro/astroshot\` |
          | Publish | **Publish npm package** (explicitly dispatched after the tag) |
          | Changelog | \`## [$NEXT] (npm)\` rolled from Unreleased |

          Once checks pass, merge so \`main\` tracks the published version.
          EOF
          )
          pr_url=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: npm $TAG" \
            --body "$body")
          echo "Opened $pr_url" >>"$GITHUB_STEP_SUMMARY"
          echo "PR: $pr_url"

          if gh pr merge "$pr_url" --squash --delete-branch 2>/dev/null; then
            echo "Merged $pr_url"
          else
            echo "Left PR open (merge when ready): $pr_url"
            gh pr merge "$pr_url" --auto --squash 2>/dev/null || true
          fi
