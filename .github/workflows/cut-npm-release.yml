name: Cut npm release

# Manually trigger from the Actions tab to:
#   1. Bump all five public packages to the same version
#      (react-shot, tui-shot, movie-harness, @archastro/astroshot, and the
#      unscoped astroshot wrapper)
#   2. Roll CHANGELOG.md Unreleased → ## [X.Y.Z] (npm)
#   3. Open a PR back to main and rebase-merge it, so main carries the bump
#   4. Tag the merged commit on main as astroshot-vX.Y.Z
#   5. Explicitly dispatch Publish npm package (GITHUB_TOKEN tag pushes do
#      not trigger other workflows)
#
# Steps 3 and 4 are in that order on purpose: publish-npm.yml rejects any tag
# whose commit is not already in origin/main, and rebase-merge rewrites SHAs,
# so a tag cut before the merge can never satisfy that gate.
#
# Same shape as archastro-js release.yml. First-time package publish still
# requires a manual bootstrap + npm trust github for each new package
# (see README / GO-LIVE-CHECKLIST).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version, e.g. 0.1.1 (overrides bump when set)"
        required: false
        type: string

concurrency:
  group: cut-npm-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cut-npm-release:
    name: Bump + branch + tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CUR="$(node -p "require('./packages/astroshot/package.json').version")"
          for directory in \
            packages/react-shot \
            packages/tui-shot \
            packages/movie-harness \
            packages/astroshot \
            packages/astroshot-unscoped
          do
            package_version="$(node -p "require('./${directory}/package.json').version")"
            if [[ "$package_version" != "$CUR" ]]; then
              echo "Package versions are not aligned ($directory=$package_version, astroshot=$CUR)" >&2
              exit 1
            fi
          done

          if [[ -n "${VERSION_INPUT// }" ]]; then
            NEXT="${VERSION_INPUT#v}"
            NEXT="${NEXT#astroshot-v}"
          else
            IFS='.' read -r MAJ MIN PAT <<<"${CUR%%-*}"
            case "$BUMP" in
              major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN + 1)); PAT=0 ;;
              patch) PAT=$((PAT + 1)) ;;
              *) echo "Invalid bump: $BUMP" >&2; exit 1 ;;
            esac
            NEXT="$MAJ.$MIN.$PAT"
          fi

          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Computed version is not valid semver: $NEXT" >&2
            exit 1
          fi
          if [[ "$NEXT" == "$CUR" ]]; then
            echo "Next version equals current ($CUR); nothing to release" >&2
            exit 1
          fi
          if git rev-parse "astroshot-v$NEXT" >/dev/null 2>&1; then
            echo "Tag astroshot-v$NEXT already exists" >&2
            exit 1
          fi

          TAG="astroshot-v$NEXT"
          BRANCH="release/$TAG"

          {
            echo "current=$CUR"
            echo "next=$NEXT"
            echo "tag=$TAG"
            echo "branch=$BRANCH"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Cut npm release"
            echo ""
            echo "- Packages: \`$CUR\` → \`$NEXT\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Tag: \`$TAG\`"
            echo "- Publish: explicit **Publish npm package** dispatch after the tag"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Bump packages + changelog on release branch
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git checkout -b "$BRANCH"
          npm run version:packages -- "$NEXT"
          node scripts/roll-changelog.mjs "$NEXT" --track npm
          git add \
            packages/react-shot/package.json \
            packages/tui-shot/package.json \
            packages/movie-harness/package.json \
            packages/astroshot/package.json \
            packages/astroshot-unscoped/package.json \
            package-lock.json \
            CHANGELOG.md
          git commit -m "release: npm $TAG"
          git push origin "$BRANCH"
      # Order matters. `publish-npm.yml` refuses any tag whose commit is not
      # already contained in origin/main, and this repository allows ONLY
      # rebase-merge, which rewrites the commit SHA. Tagging the release branch
      # and dispatching before the merge therefore produced a tag that could
      # never satisfy that gate. Merge first, then tag whatever main became.
      - name: Open + merge the release PR
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TAG: ${{ steps.bump.outputs.tag }}
          CUR: ${{ steps.bump.outputs.current }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Automated npm release branch cut by **Cut npm release**.

          | | |
          |--|--|
          | Version | \`$CUR\` → \`$NEXT\` |
          | Tag | \`$TAG\` (pushed after this PR merges) |
          | Packages | \`@archastro/react-shot\`, \`@archastro/tui-shot\`, \`@archastro/movie-harness\`, \`@archastro/astroshot\`, \`astroshot\` |
          | Publish | **Publish npm package** (dispatched once the tag is on main) |
          | Changelog | \`## [$NEXT] (npm)\` rolled from Unreleased |

          Merging this PR is what allows the release to publish.
          EOF
          )
          pr_url=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: npm $TAG" \
            --body "$body")
          echo "Opened $pr_url" >>"$GITHUB_STEP_SUMMARY"

          # --rebase, not --squash: squash merging is disabled on this repo, so
          # the old --squash call always failed and silently left the PR open.
          merged=0
          for attempt in $(seq 1 30); do
            if gh pr merge "$pr_url" --rebase --delete-branch; then
              merged=1
              break
            fi
            echo "Not mergeable yet (attempt $attempt/30); waiting for checks…"
            sleep 20
          done
          if [[ "$merged" != "1" ]]; then
            echo "Could not merge $pr_url — nothing tagged, nothing published." >&2
            echo "Merge it by hand, then re-run this workflow." >&2
            exit 1
          fi
          echo "Merged $pr_url" >>"$GITHUB_STEP_SUMMARY"

      - name: Tag the release commit now on main
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          # The rebase-merge produced a new SHA; prove it really carries this
          # release before pinning a tag to it.
          for directory in \
            packages/react-shot \
            packages/tui-shot \
            packages/movie-harness \
            packages/astroshot \
            packages/astroshot-unscoped
          do
            actual="$(node -p "require('./${directory}/package.json').version")"
            if [[ "$actual" != "$NEXT" ]]; then
              echo "main has $directory at $actual, expected $NEXT" >&2
              exit 1
            fi
          done
          git tag -a "$TAG" -m "Release astroshot $NEXT"
          git push origin "$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG" >>"$GITHUB_STEP_SUMMARY"

      - name: Dispatch Publish npm package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run "Publish npm package" \
            --repo "${{ github.repository }}" \
            --ref "$TAG"
          echo "Dispatched Publish npm package for $TAG" >>"$GITHUB_STEP_SUMMARY"
