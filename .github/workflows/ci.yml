name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the Playwright browser store into the workspace so Actions cache keys are
# OS-stable (Linux/macOS/Windows would otherwise scatter under different home
# paths). install-browser still runs every job so missing browsers and Linux
# --with-deps packages stay correct; a warm cache makes Chromium install a no-op.
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  node-tools:
    name: Node screenshot tools on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14.0", "24"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Build screenshot CLIs
        run: npm run build --workspaces --if-present

      - name: Install Chromium
        run: node packages/astroshot/bin/astroshot.mjs install-browser --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify documentation and skill commands
        env:
          ASTROSHOTS_VERIFY_INTEGRATION: "1"
        run: npm run verify:skills

      - name: Inspect published package contents
        env:
          ASTROSHOTS_VERIFY_PACKAGES_CAPTURE: "1"
        run: npm run pack:check

  pty-portability:
    name: PTY capture on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        shell: bash
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Build screenshot CLIs
        run: npm run build --workspaces --if-present

      - name: Install Chromium
        run: node packages/astroshot/bin/astroshot.mjs install-browser

      - name: Drive and capture real PTY children
        # Pass the file path after `--` so npm does not swallow vitest args.
        run: npm run test:e2e --workspace @archastro/tui-shot -- src/pty-cli.e2e.test.ts

  test:
    name: macOS app
    # mlx-swift first compile is heavy (Metal shaders + C++ backend).
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Metal toolchain (mlx-swift)
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          ensure_mlx_build_prereqs

      - name: Generate project
        working-directory: macos
        run: xcodegen generate

      - name: Test
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          xcodebuild \
            -project Astroshots.xcodeproj \
            -scheme Astroshots \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-test \
            "${ASTROSHOTS_XCODEBUILD_FLAGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Compile signed-desktop review proof
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          xcodebuild \
            -project Astroshots.xcodeproj \
            -scheme AstroshotsReviewUITests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-review-ui \
            "${ASTROSHOTS_XCODEBUILD_FLAGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Package branded DMG end-to-end proof
        working-directory: macos
        run: ./scripts/test-package-dmg.sh
