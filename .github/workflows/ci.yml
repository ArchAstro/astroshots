name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the Playwright browser store into the workspace so Actions cache keys are
# OS-stable (Linux/macOS/Windows would otherwise scatter under different home
# paths). install-browser still runs every job so missing browsers and Linux
# --with-deps packages stay correct; a warm cache makes Chromium install a no-op.
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  node-tools:
    name: Node screenshot tools on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14.0", "24"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Build screenshot CLIs
        run: npm run build --workspaces --if-present

      - name: Install Chromium
        run: node packages/astroshot/bin/astroshot.mjs install-browser --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify documentation and skill commands
        env:
          ASTROSHOTS_VERIFY_INTEGRATION: "1"
        run: npm run verify:skills

      - name: Inspect published package contents
        env:
          ASTROSHOTS_VERIFY_PACKAGES_CAPTURE: "1"
        run: npm run pack:check

  pty-portability:
    name: PTY capture on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        shell: bash
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Build screenshot CLIs
        run: npm run build --workspaces --if-present

      - name: Install Chromium
        run: node packages/astroshot/bin/astroshot.mjs install-browser

      - name: Drive and capture real PTY children
        # Pass the file path after `--` so npm does not swallow vitest args.
        run: npm run test:e2e --workspace @archastro/tui-shot -- src/pty-cli.e2e.test.ts

  rust:
    name: Rust astroshot on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      # Tests that need Node, Chrome, or ffmpeg skip when the tool is missing
      # on a developer machine. In CI a missing tool fails the test instead.
      ASTROSHOT_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      # The Node helper (rust/node-helper) loads vite, tsx, ink, react, and
      # playwright-core from the root node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages the fixtures import
        run: npm run build --workspaces --if-present

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace --no-fail-fast

  rust-target-check:
    # archdev links the astroshot-engine and astroshot-review crates into a
    # binary released for these seven targets. `cargo check` needs only the target's std, no cross linker, so
    # each triple is checked on a runner of the same OS family. It proves the
    # crates compile; linking and execution are covered by the `rust` and
    # `rust-windows` jobs and by archdev's release workflow.
    name: cargo check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Check
        working-directory: rust
        run: cargo check --workspace --locked --target ${{ matrix.target }}

  rust-windows:
    # One real Windows execution: the PTY still tests drive the built binary
    # through ConPTY and rasterize the result to PNG.
    name: Rust astroshot PTY stills on windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ASTROSHOT_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages the fixtures import
        run: npm run build --workspaces --if-present

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Enable temporary PTY diagnostics
        shell: pwsh
        run: echo "ASTROSHOT_PTY_DEBUG_LOG=$env:RUNNER_TEMP\\pty-debug.log" >> $env:GITHUB_ENV

      - name: PTY still tests
        working-directory: rust
        run: cargo test -p astroshot --test tui_shot_cli --no-fail-fast

      - name: Show PTY diagnostics
        if: always()
        shell: pwsh
        run: if (Test-Path $env:ASTROSHOT_PTY_DEBUG_LOG) { Get-Content $env:ASTROSHOT_PTY_DEBUG_LOG | Select-Object -First 400 }

  test:
    name: macOS app
    # mlx-audio-swift requires Swift tools 6.2 → Xcode 26 on macos-26.
    # mlx-swift first compile is heavy (Metal shaders + C++ backend).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          set -euo pipefail
          # Prefer the image default Xcode.app (26.6 on current macos-26 images).
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            echo "error: no Xcode 26 install found" >&2
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain (mlx-swift)
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          ensure_mlx_build_prereqs

      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Build and verify offline tools
        run: |
          npm install --global npm@11.17.0
          npm ci
          macos/scripts/build-tools-payload.sh
          macos/scripts/verify-tools-payload.sh "$PWD/macos/build/Tools" --reject-cases

      - name: Generate project
        working-directory: macos
        run: xcodegen generate

      - name: Test
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          xcodebuild \
            -project Astroshots.xcodeproj \
            -scheme Astroshots \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-test \
            "${ASTROSHOTS_XCODEBUILD_FLAGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      # Must run after `test`: Swift Testing parallelism means no in-process
      # test can be scheduled last, and cfprefsd flushes a leaked suite to disk
      # after the test process exits.
      - name: Assert tests leaked no preference plists
        working-directory: macos
        run: ./scripts/check-preference-leaks.sh

      - name: Compile signed-desktop review proof
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          xcodebuild \
            -project Astroshots.xcodeproj \
            -scheme AstroshotsReviewUITests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-review-ui \
            "${ASTROSHOTS_XCODEBUILD_FLAGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Package branded DMG end-to-end proof
        working-directory: macos
        run: ./scripts/test-package-dmg.sh
