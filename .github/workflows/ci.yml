name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: macos
        run: xcodegen generate

      - name: Test
        working-directory: macos
        run: |
          set -euo pipefail
          xcodebuild \
            -project Astroshots.xcodeproj \
            -scheme Astroshots \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

  dmg:
    name: Package signed DMG
    runs-on: macos-15
    timeout-minutes: 60
    needs: test
    # Fork PRs do not receive secrets — skip packaging there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CERT:-}" ]] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [[ -n "${CERT_PW:-}" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "${IDENTITY:-}" ]] || missing+=(MACOS_CODE_SIGN_IDENTITY)
          [[ -n "${TEAM:-}" ]] || missing+=(MACOS_DEVELOPMENT_TEAM)
          if [[ -z "${KEY_ID:-}" || -z "${ISSUER:-}" || -z "${KEY_B64:-}" ]]; then
            if [[ -z "${APPLE_ID:-}" || -z "${APP_PW:-}" ]]; then
              missing+=(APPLE_API_KEY_ID/ISSUER/BASE64_or_APPLE_ID+APP_SPECIFIC_PASSWORD)
            fi
          fi
          if ((${#missing[@]})); then
            echo "missing<<EOF" >>"$GITHUB_OUTPUT"
            printf '%s\n' "${missing[@]}" >>"$GITHUB_OUTPUT"
            echo "EOF" >>"$GITHUB_OUTPUT"
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "::warning::Signing/notarization secrets incomplete — see docs/SIGNING.md"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Fail if secrets missing
        if: steps.secrets.outputs.ready != 'true'
        run: |
          set -euo pipefail
          echo "Cannot build a Gatekeeper-clean DMG without secrets:"
          echo "${{ steps.secrets.outputs.missing }}"
          echo ""
          echo "Add them under Settings → Secrets → Actions. Full list: docs/SIGNING.md"
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x macos/scripts/ci-import-certificate.sh
          ./macos/scripts/ci-import-certificate.sh

      - name: Build, sign, notarize DMG
        working-directory: macos
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh --out "$GITHUB_WORKSPACE/dist/Astroshots.dmg"
          if compgen -G "build/Astroshots-*.dmg" > /dev/null; then
            cp build/Astroshots-*.dmg "$GITHUB_WORKSPACE/dist/"
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astroshots-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Summarize
        run: |
          set -euo pipefail
          ls -lh dist/*.dmg
          echo "### Astroshots DMG (signed + notarized)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **Astroshots-dmg**. Gatekeeper should accept a normal open." >> "$GITHUB_STEP_SUMMARY"
