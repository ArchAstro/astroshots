name: Release DMG

# Attach a DMG to a GitHub Release when you push a version tag (v0.1.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the DMG to (optional; leave empty for a plain artifact)"
        required: false
        default: ""

concurrency:
  group: release-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dmg:
    name: Build & attach DMG
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build DMG
        working-directory: macos
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh --out "$GITHUB_WORKSPACE/dist/Astroshots.dmg"
          # Versioned copy produced next to the stable name under macos/build/
          if compgen -G "build/Astroshots-*.dmg" > /dev/null; then
            cp build/Astroshots-*.dmg "$GITHUB_WORKSPACE/dist/"
          fi
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astroshots-dmg-release
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Create the release if this is a new tag push and none exists yet.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Astroshots $TAG" \
              --generate-notes \
              dist/*.dmg
          else
            gh release upload "$TAG" dist/*.dmg --clobber
          fi
