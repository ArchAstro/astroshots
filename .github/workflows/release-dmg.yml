name: Release DMG

# Signed + notarized DMG only for version tags (and optional manual re-run).
# PRs and branch pushes exercise the same layout with an ad-hoc build in CI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and attach (e.g. v0.1.0). Leave empty when re-running from a tag push."
        required: false
        default: ""

concurrency:
  group: release-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dmg:
    name: Signed notarized DMG
    # mlx-audio-swift needs Swift tools 6.2 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_dispatch with a tag input, still check out default ref;
          # packaging builds from the tree at that ref if you check out the tag.
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Check signing secrets
        id: secrets
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CERT:-}" ]] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [[ -n "${CERT_PW:-}" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "${IDENTITY:-}" ]] || missing+=(MACOS_CODE_SIGN_IDENTITY)
          [[ -n "${TEAM:-}" ]] || missing+=(MACOS_DEVELOPMENT_TEAM)
          if [[ -z "${KEY_ID:-}" || -z "${ISSUER:-}" || -z "${KEY_B64:-}" ]]; then
            if [[ -z "${APPLE_ID:-}" || -z "${APP_PW:-}" ]]; then
              missing+=(APPLE_API_KEY_ID/ISSUER/BASE64_or_APPLE_ID+APP_SPECIFIC_PASSWORD)
            fi
          fi
          if ((${#missing[@]})); then
            echo "Missing secrets:"
            printf '  %s\n' "${missing[@]}"
            echo "See docs/SIGNING.md"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain (mlx-swift)
        working-directory: macos
        run: |
          set -euo pipefail
          source scripts/xcode-env.sh
          ensure_mlx_build_prereqs

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x macos/scripts/ci-import-certificate.sh
          ./macos/scripts/ci-import-certificate.sh

      - name: Build, sign, notarize DMG
        working-directory: macos
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: expected a semantic version tag (vX.Y.Z), got: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(
            awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml
          )"
          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "error: tag $TAG does not match project version $PROJECT_VERSION" >&2
            exit 1
          fi

          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh \
            --out "$GITHUB_WORKSPACE/dist/Astroshots-${VERSION}.dmg"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astroshots-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "error: expected a version tag (v*), got: $TAG" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Astroshots $TAG" \
              --generate-notes \
              dist/*.dmg
          else
            gh release upload "$TAG" dist/*.dmg --clobber
          fi
