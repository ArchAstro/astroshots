name: Publish npm package

# Tag push (when not suppressed) and explicit dispatch from Cut npm release.
# Tags pushed by GITHUB_TOKEN do not trigger workflows; Cut npm release always
# dispatches this workflow with --ref astroshot-vX.Y.Z.

on:
  push:
    tags:
      - "astroshot-v*"
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

# Same browser store path as CI so warm caches transfer across workflows.
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish with npm trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require a release commit from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in origin/main" >&2
            exit 1
          fi

      - name: Read release version from tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            astroshot-v*)
              echo "version=${TAG#astroshot-v}" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported npm release tag: $TAG" >&2
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Build screenshot CLIs
        run: npm run build --workspaces --if-present

      - name: Verify tag matches every package version
        env:
          TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for directory in packages/react-shot packages/tui-shot packages/astroshot; do
            package_version="$(node -p "require('./${directory}/package.json').version")"
            if [[ "$package_version" != "$TAG_VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match $directory version $package_version" >&2
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import astroshot from "./packages/astroshot/package.json" with { type: "json" };

          const version = process.env.TAG_VERSION;
          assert.equal(
            astroshot.dependencies["@archastro/react-shot"],
            version,
            "@archastro/astroshot must depend on the release version of @archastro/react-shot",
          );
          assert.equal(
            astroshot.dependencies["@archastro/tui-shot"],
            version,
            "@archastro/astroshot must depend on the release version of @archastro/tui-shot",
          );
          NODE

      - name: Install Chromium
        run: node packages/astroshot/bin/astroshot.mjs install-browser --with-deps

      - name: Verify packages
        run: |
          npm run typecheck --workspaces --if-present
          npm test --workspaces --if-present
          npm run pack:check

      - name: Publish rendering engines
        run: |
          node scripts/publish-package.mjs @archastro/react-shot
          node scripts/publish-package.mjs @archastro/tui-shot

      - name: Publish unified CLI
        run: node scripts/publish-package.mjs @archastro/astroshot

      - name: Create GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(cat <<EOF
          Published to npm:

          - https://www.npmjs.com/package/@archastro/react-shot/v/$VERSION
          - https://www.npmjs.com/package/@archastro/tui-shot/v/$VERSION
          - https://www.npmjs.com/package/@archastro/astroshot/v/$VERSION

          See \`CHANGELOG.md\` section \`## [$VERSION] (npm)\`.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" \
              --title "@archastro/astroshot v$VERSION" \
              --notes "$notes" \
              --generate-notes
          fi
