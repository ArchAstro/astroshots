# The `astroshot` CLI: argument parsing, help text, argv[0] personalities,
# doctor, demo and init on top of astroshot-engine and astroshot-review. See
# ../PORTING.md.
[package]
name = "astroshot"
description = "Astroshots command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The CLI package's `bin/*.mjs` ports to `src/bin/` as ordinary modules.
autobins = false

[[bin]]
name = "astroshot"
path = "src/main.rs"

[dependencies]
astroshot-engine = { path = "../astroshot-engine" }
astroshot-review = { path = "../astroshot-review" }
anyhow = "1"
chrono = "0.4"
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
alacritty_terminal = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
tempfile = "3"
walkdir = "2"

[lints]
workspace = true
