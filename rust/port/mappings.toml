[[construct]]
id = "global-fetch"
title = "fetch(...) (global HTTP client)"
query = '''
(call_expression
  function: (identifier) @fn
  (#eq? @fn "fetch")) @match
'''
rust = "`reqwest` through a per-thread client: `thread_local! { static HTTP_CLIENT: reqwest::Client = reqwest::Client::new(); }` plus `fn http_client() -> reqwest::Client { HTTP_CLIENT.with(reqwest::Client::clone) }`. Never a process-wide `static ...: LazyLock<reqwest::Client>`."
hazards = [
  "A `reqwest::Client` pools keep-alive connections bound to the tokio runtime that opened them. A process-wide static shared by several runtimes (every `#[tokio::test]` builds its own, and wiremock reuses ports) hands a later runtime a connection whose reactor is gone; the request never completes and the test hangs at 0% CPU, often while holding `temp_env`'s global lock so every env-using test stalls behind it.",
]

[[construct]]
id = "clock-or-function"
title = "Clock | (() => number) parameter normalized by clockNow"
query = '''
(union_type
  (type_identifier) @t
  (#eq? @t "Clock")) @match
'''
rust = "a `ClockSource` enum (`Clock(Arc<dyn Clock>)` or `Function(NowFn)`) normalized by `clock_now(impl Into<ClockSource>) -> NowFn`; any `Fn() -> i64` closure converts. When a ported module already takes a `now` closure with a `Date.now` default, keep the closure: a caller holding a `Clock` passes `clock_now(clock)`. Use `clock_now_default()` for the omitted argument. A trailing optional `clock: Clock = systemClock` parameter on an exported function becomes a paired `f_with_clock(.., clock: &dyn Clock)` with `f` delegating through `SystemClock`, so existing callers stay unchanged."

