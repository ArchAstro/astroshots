# Starter mappings for TypeScript -> Rust ports with `rustify`.
#
# This file lives in the project's rustify state dir. `rustify brief` matches
# every [[construct]] query against the TypeScript files being ported and
# prints the guidance (`rust`, `hazards`) next to the lines it found; the
# [[package]] entries say what each npm / node: import becomes. `rustify
# graph` prints hit counts per rule.
#
# Queries use the tree-sitter-typescript grammar; capture the reported node
# as @match. `rustify` refuses to start if a query does not compile.
# Write alternatives that need predicates as separate top-level patterns:
# tree-sitter applies every predicate in a pattern to every branch of a
# `[...]` alternation, so `[(a @x (#eq? @x "A")) (b @x (#eq? @x "B"))]`
# never matches. Check any rule that reports 0 hits against the source
# before trusting it.
# Runtime model assumed throughout: tokio multi-thread runtime.
# Entries mention helpers such as a JS-exact stringifier or a readdir-order
# sorter generically; supply your own (or a crate) for them in the port.

# ─── Async and concurrency ────────────────────────────────────────────────

[[construct]]
id = "async-fn"
title = "async function"
query = '''
[
  (function_declaration "async") @match
  (method_definition "async") @match
  (arrow_function "async") @match
  (function_expression "async") @match
]
'''
rust = "`async fn` on the tokio runtime. Only keep it async if it awaits I/O, a timer, or another async fn; pure computation becomes a plain `fn`."
hazards = [
  "A TS async function runs synchronously until its first await; a Rust future does nothing until polled. Code that relied on eager side effects before the first await must do them before returning the future or be awaited immediately.",
  "Pattern for eager registration (queues, ordering): a plain `fn` that does the side effect, then returns `async move { … }`. Release with a guard type whose `Drop` mirrors the TS `finally`.",
  "When the eagerly-registering method must also return a value from the deferred part, keep it a plain (non-`async`) `fn` performing the synchronous mutations, returning `futures::future::BoxFuture<'static, T>` for the rest.",
]

[[construct]]
id = "promise-combinator"
title = "Promise.all / allSettled / race / any"
query = '''
(call_expression
  function: (member_expression
    object: (identifier) @obj
    property: (property_identifier) @prop)
  (#eq? @obj "Promise")
  (#match? @prop "^(all|allSettled|race|any)$")) @match
'''
rust = "all → `futures::future::try_join_all` (fail fast) or `tokio::task::JoinSet` when tasks should run on other worker threads; allSettled → `join_all` over `Result`s; race → `tokio::select!`; any → `futures::future::select_ok`."
hazards = [
  "Promise.all over a mapped array runs every element concurrently on one thread. `JoinSet::spawn` runs them in parallel across the pool, so shared state needs `Arc` + `Mutex`/`RwLock` or message passing.",
  "Promise.all rejects on the first error but does not cancel the others; dropping a Rust join cancels them. Keep side effects idempotent or collect results explicitly.",
]

[[construct]]
id = "new-promise"
title = "new Promise(...) wrapping a callback API"
query = '''
(new_expression constructor: (identifier) @ctor (#eq? @ctor "Promise")) @match
'''
rust = "Usually unnecessary: use the async API directly (`tokio::fs`, `tokio::process`, `tokio::time::sleep`). For true callback bridges use `tokio::sync::oneshot`."

[[construct]]
id = "await-in-loop"
title = "await inside a loop"
# Queries cannot say "at any depth", so match the loop and let `contains`
# find an await anywhere in its body (outside nested functions).
contains = "await_expression"
query = '''
[
  (for_statement) @match
  (for_in_statement) @match
  (while_statement) @match
  (do_statement) @match
]
'''
rust = "Sequential awaits stay sequential in a `for` loop. If iterations are independent, this is a place to gain throughput with `JoinSet` or `futures::stream::iter(..).buffer_unordered(n)`; keep order-dependent loops sequential."

[[construct]]
id = "for-await"
title = "for await (… of stream)"
query = '''
(for_in_statement "await") @match
'''
rust = "`while let Some(item) = stream.next().await` over a `futures::Stream` (`tokio_stream`, `async-stream` for generators)."

[[construct]]
id = "timer"
title = "setTimeout / setInterval / setImmediate"
query = '''
(call_expression
  function: (identifier) @fn
  (#match? @fn "^(setTimeout|setInterval|setImmediate|clearTimeout|clearInterval)$")) @match
'''
rust = "`tokio::time::sleep`, `tokio::time::interval` (set `MissedTickBehavior`), `tokio::task::yield_now`. Cancellation: keep the `JoinHandle` and `abort()`, or a `CancellationToken`."
hazards = [
  "`timer.unref()` means \"don't keep the process alive\"; in Rust the runtime exits when `main` returns, so model shutdown explicitly.",
  "setInterval → `interval_at(Instant::now() + period, period)` with `MissedTickBehavior::Delay`: `interval()` ticks immediately, and the default Burst catches up missed ticks. Create the interval before the `async move` block, not inside it, or the period starts at the task's first poll.",
  "Paused-clock tests that race a deadline against real socket I/O on another task can see tokio auto-advance past the deadline before the I/O is ready. Any busy-poll workaround (`yield_now` until `Instant::now() >= deadline`) must be `#[cfg(test)]` with a `#[cfg(not(test))]` `sleep_until` twin; shipped, it spins a worker for the life of every wait.",
  "vi.useFakeTimers → `#[tokio::test(start_paused = true)]`; step `tokio::time::advance` 1ms at a time with `yield_now` to mirror `vi.advanceTimersByTime`. A default clock built on `tokio::time::Instant` follows paused time, as a mocked Date.now did.",
  "process.nextTick (\"run this after the current synchronous work, before I/O\") is NOT safely modeled by `tokio::spawn` + one `tokio::task::yield_now().await`, despite looking like the obvious translation. Under `rt-multi-thread` (the `#[tokio::main]` default), a caller that keeps its own worker busy -- e.g. draining several already-available reads back-to-back with no real `.await` on I/O in between -- is not guaranteed to let that freshly spawned task get polled promptly; recovery depends on scheduler fairness that isn't bounded on any particular timescale. `#[tokio::test]` defaults to the single-threaded `current_thread` flavor and never exercises this, so the bug is invisible in the default test suite (opt into `#[tokio::test(flavor = \"multi_thread\", worker_threads = N)]` to catch it, and don't add debug instrumentation such as `eprintln!` to the code under test while chasing it -- even a bare `AtomicUsize` counter was enough to perturb scheduling and mask a real race). If a deferred step must be immune to a busy caller under `rt-multi-thread`, hand it to `tokio::task::spawn_blocking` instead (a dedicated OS thread the work-stealing scheduler doesn't arbitrate) rather than another `tokio::spawn`.",
  "setImmediate/clearImmediate: the internal `tokio::task::yield_now().await` before firing the callback (`tokio::spawn(async move { tokio::task::yield_now().await; fire(); })`, returning `task.abort()` as the canceller) is required, not cosmetic — without it a spawned task on a multi-thread runtime can start executing on another worker thread almost immediately, racing ahead of the 'caller already returned synchronously' guarantee that setImmediate gives for free in single-threaded JS.",
  "When a ported closure computes `return { ...state }` synchronously immediately before triggering deferred/timer work that could later mutate the same state, capture that return value into a local *before* calling the scheduler (and before dropping any lock protecting the state) rather than re-reading state afterward. JS callers never observe the deferred work racing ahead of the synchronous return (one thread); Rust's multi-thread runtime can.",
]

[[construct]]
id = "abort-controller"
title = "AbortController / AbortSignal"
query = '''
((new_expression constructor: (identifier) @c) @match (#eq? @c "AbortController"))
((type_identifier) @match (#eq? @match "AbortSignal"))
'''
rust = "`tokio_util::sync::CancellationToken`; select on `token.cancelled()` in long operations. An `abort` listener becomes a task awaiting `cancelled()`: it runs after the next yield, not synchronously inside `cancel()` (tests `yield_now` before asserting)."

[[construct]]
id = "event-emitter"
title = "EventEmitter"
query = '''
((new_expression constructor: (identifier) @c) @match (#eq? @c "EventEmitter"))
((extends_clause value: (identifier) @e) @match (#eq? @e "EventEmitter"))
((identifier) @match (#eq? @match "EventEmitter"))
'''
rust = "A typed channel: `tokio::sync::broadcast` for many listeners, `mpsc` for one consumer, `watch` for latest-value state. Replace string event names with an enum."
hazards = [
  "A duck-typed Node stream/EventEmitter API meant for another library's event loop model (`NodeJS.ReadStream`, a terminal UI library's flowing vs paused consumption) becomes constructor-supplied callbacks (`impl Fn` params) instead of a replicated subscribable stream object.",
]

# ─── Types and data modelling ─────────────────────────────────────────────

[[construct]]
id = "interface"
title = "interface"
query = "(interface_declaration) @match"
rust = "`#[derive(Debug, Clone, Serialize, Deserialize)] struct` for data; a `trait` when the interface is implemented by several classes or mocked in tests."
hazards = [
  "Structural typing: TS accepts any object with the right shape. Rust needs an explicit type or `From` impls at every boundary.",
  "A TS mapped type keyed by a companion string-literal union (`interface Data { \"a\": X; \"b\": Y }` + `type Type = keyof Data`, used as `(type: Type, data: Data[Type])` dependent-pair params) has no Rust dependent typing: fuse into one discriminated-union enum, one variant per key wrapping that key's payload, `#[serde(tag = \"type\", content = \"data\")]` with each variant's `#[serde(rename = \"<exact ts key>\")]` copied verbatim (keys may mix casing/punctuation, so no single `rename_all` rule covers them). Keep a plain payload-less twin enum only if call sites need the tag alone; derive it from the fused enum via a match-based accessor (e.g. `Data::event_type()`), not a second hand-maintained list.",
  "An optional method on an interface ported as a trait (`listSessionsStrict?()`): a trait method returning `Option<BoxFuture<...>>` with a default body returning `None`, so implementers without it compile unchanged.",
  "An already-ported trait method returns no `Result`, but a later TS implementation throws from it: change the trait to return `Result` and update every implementor and caller; never panic to fit the old signature.",
  "An interface whose fields are all callbacks the embedding binary supplies as configuration (not implemented by several classes, no shared state) is a struct of `Arc<dyn Fn(...) + Send + Sync>` fields, not a trait. Name each callback type with a `pub type` alias up front; clippy's `type_complexity` rejects them inline.",
  "A field typed `Promise<T> | T` (the host may answer sync or async) is always an `Arc<dyn Fn(...) -> BoxFuture<'static, T> + Send + Sync>`; a field with no `Promise` in its type stays a plain `Fn`.",
  "A class whose methods are synchronous but which implements an async trait shared with truly async implementations keeps sync inherent methods (called directly by its ported tests) and wraps them in `tokio::task::spawn_blocking` only in the trait impl.",
  "A function that returns a `{ ok, ... }` result object and can also reject on host I/O returns `Result<Result<T, ReasonError>, HostError>`: the inner result is the TS return value callers match on, the outer error is the rejection.",
  "A `WeakMap` keyed by an object the class itself returned (side data fenced to that exact value) becomes a private field on the returned type, and that type must not derive `Clone`: a copy would carry the side data TS's identity lookup would miss.",
  "An intersection `A & { extra }` used only as one function's parameter becomes separate parameters, not a new struct (`CliClient::node(app_name, defaults, overrides)`).",
  "A serde struct serializes in field order; a TS object literal serializes in insertion order, which differs per construction site when keys are assigned conditionally (`creds.email = ...` after `{ server, apps }`). When one struct backs several TS construction sites, their key orders cannot all match: record the divergence in the module's notes.",
  "Reuse one Rust struct across enum variants only when the TS source itself names and shares one interface across those keys. Two keys with coincidentally identical anonymous inline object shapes get their own named structs — TS's structural typing is not a signal to collapse the Rust types, and the shapes could diverge independently later.",
]

[[construct]]
id = "optional-property"
title = "optional property (`x?: T`)"
query = "(property_signature \"?\") @match"
rust = "`Option<T>` with `#[serde(default, skip_serializing_if = \"Option::is_none\")]` when the JSON must omit it."
hazards = [
  "TS distinguishes a missing key from `undefined` and from `null`; serde collapses them to `None` unless you use `Option<Option<T>>` or `serde_with::rust::double_option`.",
]

[[construct]]
id = "union-type"
title = "union type"
query = "(union_type) @match"
rust = "An `enum`. String-literal unions → unit variants with `#[serde(rename_all = \"snake_case\")]` (or per-variant `rename`). Object unions tagged by a `kind`/`type` field → `#[serde(tag = \"kind\")]`."
hazards = [
  "Check the exact wire spelling of each literal; rename_all is only right when every variant follows the rule.",
  "A discriminated union whose call sites read a shared field WITHOUT narrowing on the tag first (TS allows `state.error` on the whole union when every arm declares `error`, even with different literal types per arm) needs accessor methods on the Rust enum (`fn error(&self) -> Option<&str>`) instead of forcing every caller to `match` — check the union's call sites in other TS files, not just its declaration, to know whether this applies.",
  "`#[serde(tag = \"...\")]` internally-tagged enums serialize the tag key first and can only emit the fields a given variant's own struct declares. A TS union that declares ALL fields on EVERY arm (a `null` literal type on arms that don't use a field, so the JSON always has the same keys in the same order) will not round-trip to byte-identical JSON via a naive tagged enum; call this out explicitly when a later batch might persist the value.",
  "A TS return type shaped `{ ok: true, tokens } | { ok: false, error }` (or similar boolean-discriminated success/failure object) is a plain `Result<T, String>` (or a typed error), not a mirrored `Ok`/`Err`-variant enum — Rust already has the idiom.",
  "An inline union not itself exported (e.g. a parameter typed `ThemeName | ThemeMode`) gets a small local Rust enum named for its role; it has no TS export to map from, so record it in the module's notes instead.",
]

[[construct]]
id = "discriminant-switch"
title = "switch statement"
query = "(switch_statement) @match"
rust = "`match` on an enum; the compiler then enforces exhaustiveness that TS `never` checks only approximated."
hazards = [
  "A TS function that's a structural no-op in every branch (e.g. a `wrapChunk` whose every case returns its input unchanged) keeps the same branches when ported rather than collapsing to an identity function — note the oddity in a doc comment instead of 'fixing' it, so structural diffs stay meaningful for later drift passes.",
]

[[construct]]
id = "enum"
title = "enum"
query = "(enum_declaration) @match"
rust = "Rust `enum`; numeric enums with `#[repr(u8)]` only if the numbers cross a boundary."

[[construct]]
id = "class"
title = "class"
query = '''
[
  (class_declaration) @match
  (abstract_class_declaration) @match
]
'''
rust = "`struct` + `impl`. Mutable shared instances become `Arc<Mutex<_>>` (or an actor task owning the state and a channel handle) only when they are shared across tasks."
hazards = [
  "Methods passed as callbacks lose `this` in TS unless bound; in Rust capture what the closure needs explicitly.",
  "A TS module exporting mutable `let` bindings reassigned together (a live-reassigned palette/state object with no class wrapping it) has no direct Rust equivalent either: port it the same way as shared instance state — one `LazyLock<RwLock<StateSnapshot>>` (Copy struct) plus one accessor `fn` per binding. Each binding needs an explicit name mapping (`TS_NAME` -> `snake_case_fn`) in your port notes even when the name already matches snake_case, because the export *kind* changed from const/let to fn.",
]

[[construct]]
id = "inheritance"
title = "class inheritance (extends)"
query = "(class_heritage (extends_clause)) @match"
rust = "Composition plus a `trait` for the overridden behavior. No implementation inheritance in Rust; `Error` subclasses become enum variants (see throw/catch)."

[[construct]]
id = "private-field"
title = "private field (#x) / private members"
query = '''
[
  (private_property_identifier) @match
  (accessibility_modifier) @match
]
'''
rust = "Private struct fields (default visibility); `pub(crate)` for what sibling modules use."
hazards = [
  "Only a TS file's actual `export`ed surface constrains the Rust module's public API. An unexported helper interface/class (e.g. a private `FilterSink`-style callback interface) can be redesigned freely — callback interface to owned return value, class to free functions — as long as the file's exported functions/types keep the TS-documented behavior. Check the file's list of exports, not every internal type, before deciding what must be preserved verbatim.",
]

[[construct]]
id = "getter-setter"
title = "get/set accessor"
query = '''
[
  (method_definition "get") @match
  (method_definition "set") @match
]
'''
rust = "Plain methods `fn x(&self) -> T` / `fn set_x(&mut self, v: T)`."

[[construct]]
id = "default-parameter"
title = "default parameter value"
query = "(required_parameter value: (_)) @match"
rust = "Rust has no default parameter values: every parameter becomes required."
hazards = [
  "A trailing defaulted parameter (`fn(a, b, nowMs = Date.now(), retryBaseMs = 60_000)`) becomes a Rust function with every parameter required (no default params); expose the TS default as a `pub const` (e.g. `DEFAULT_RETRY_BASE_MS`) so call sites don't have to guess it.",
  "A default-producing closure parameter (`now: () => number = () => Date.now()`, a clock/RNG/etc. seam) becomes `Option<Arc<dyn Fn() -> T + Send + Sync>>` with `.unwrap_or_else(|| Arc::new(default_fn))` inside, not two separate constructors and not a required parameter that pushes the default onto every caller.",
  "A default that reads another parameter (`fn(cli, url = cli.defaults.url)`) becomes `Option<T>` resolved inside the function from that parameter.",
]

[[construct]]
id = "generics"
title = "generic type parameters"
query = "(type_parameters) @match"
rust = "Rust generics with explicit trait bounds (`T: Serialize + Send + 'static` for anything crossing tasks)."
hazards = [
  "A structural generic constraint on a still-unported 'row' shape (e.g. `T extends { content?: string; role: string; name?: string }`) is a small accessor trait (`fn content(&self) -> Option<&str>`, etc.), not a concrete struct picked up front. The future concrete row type implements the trait with one mechanical impl block when its module is ported, and the already-ported generic function's signature never has to change.",
]

[[construct]]
id = "record-map-type"
title = "Record<K, V> / index signature"
query = '''
((generic_type name: (type_identifier) @n) @match (#eq? @n "Record"))
(index_signature) @match
'''
rust = "`BTreeMap<String, V>` for deterministic output (snapshot/JSON stability) or `HashMap` when order never leaks. `IndexMap` if insertion order matters."
hazards = [
  "JS objects keep insertion order for string keys; `HashMap` does not. Anything serialized, hashed, or diffed needs `BTreeMap`/`IndexMap`.",
  "A `Record` built from user input (`obj[key] = v`) enumerates array-index keys (`\"0\"`, `\"12\"`) first, ascending, and ignores `__proto__`: fill an `IndexMap` through a helper that reproduces that ordering.",
  "Replacing TS's `as const satisfies Record<ClosedUnion, V>` completeness check: a Rust `match` over the closed source enum (not a runtime HashMap/lookup table) gives the same guarantee at compile time, and strictly stronger — an unhandled variant is a compile error, not a passed CI check. Prefer a match function over building and looking up a static map whenever the mapping is from one closed enum to another.",
  "`Record<string, unknown> & { requiredField: T; ... }` (arbitrary extra keys plus some required ones) is a struct with the required fields typed normally plus a trailing `#[serde(flatten)] extra: IndexMap<String, serde_json::Value>` for everything else.",
]

[[construct]]
id = "map-set"
title = "Map / Set / WeakMap"
query = '''
(new_expression constructor: (identifier) @c (#match? @c "^(Map|Set|WeakMap|WeakSet)$")) @match
'''
rust = "`IndexMap`/`IndexSet` when iteration order is observable (JS Map/Set iterate in insertion order), else `HashMap`/`HashSet`. WeakMap caches usually become explicit ownership."
hazards = [
  "A TS `Map<string, Promise<T>>` kept only so a later call can await-all-of-them-with-a-timeout (e.g. session-teardown draining background work) is `IndexMap<String, futures::future::Shared<BoxFuture<'static, T>>>` plus a generation-counter (see the `child-process` construct): `track()` must eagerly `tokio::spawn` a task driving the future to completion and self-clearing the entry (mirrors TS's eager `.then(clear, clear)` registered synchronously at call time, since a Rust future does nothing until polled), and the later drain call clones out the `Shared` futures and races them against a `tokio::time::sleep` deadline with `tokio::select!`.",
]

[[construct]]
id = "any-unknown"
title = "any / unknown"
query = '''
((predefined_type) @match (#match? @match "^(any|unknown)$"))
'''
rust = "`serde_json::Value` at untyped JSON boundaries; otherwise give it a real type. `unknown` in `catch` is the error type."

[[construct]]
id = "type-assertion"
title = "type assertion / non-null (`as T`, `x!`)"
query = '''
[
  (as_expression) @match
  (non_null_expression) @match
  (satisfies_expression) @match
]
'''
rust = "No unchecked casts: parse (`serde_json::from_value`), `TryFrom`, or `.expect(\"reason\")` for invariants you can state."
hazards = [
  "`x as Foo` on parsed JSON is unchecked in TS; the Rust port must validate or the behavior changes on bad input. Decide which, and test it.",
]

[[construct]]
id = "instanceof-typeof"
title = "instanceof / typeof checks"
query = '''
[
  (binary_expression operator: "instanceof") @match
  (unary_expression operator: "typeof") @match
]
'''
rust = "`match` on an enum or `serde_json::Value` variant; `downcast_ref` only for `anyhow::Error`/`dyn Error` chains."
hazards = [
  "The `(typeof x === \"string\" && x) || (typeof y === \"string\" && y) || ... || \"\"` fallback idiom (first non-empty string among several optional untyped JSON fields, JS-falsy on empty string) is `[\"x\",\"y\",...].iter().find_map(|k| value.get(*k).and_then(Value::as_str).filter(|s| !s.is_empty()))`.",
]

[[construct]]
id = "js-global-helper"
title = "Number() / parseInt / parseFloat / decodeURIComponent / encodeURIComponent"
query = '''
(call_expression
  function: (identifier) @fn
  (#match? @fn "^(Number|parseInt|parseFloat|decodeURIComponent|encodeURIComponent)$")) @match
'''
rust = "Keep one shared set of JS-semantics helpers (number parsing, truthiness, trimming, stringifying) instead of re-deriving JS coercion at each call site."
hazards = [
  "`Number(value)` string coercion and `Number.isSafeInteger` need shared helpers (a `parse_number` and an `is_safe_integer`); a `nonNegativeInteger`/`positiveInteger`-shaped TS validator should reuse them instead of re-deriving. `parse_number` should be gated behind a regex matching JS's `StrNumericLiteral` grammar before delegating to `f64::from_str`, because `f64::from_str` accepts spellings JS's `Number()` rejects (`Number(\"infinity\")` is `NaN`; `f64::from_str(\"infinity\")` is `Ok(inf)`) — verified empirically against node, not just reasoned about.",
  "`decodeURIComponent` has no crate in this codebase; hand-roll it as `fn(&str) -> Option<String>` (percent-decode `%xx` hex pairs, then `String::from_utf8` to validate the result), returning `None` on a malformed/incomplete escape or invalid UTF-8 so the caller can fall back to the original text with `.unwrap_or_else(...)`, matching a TS `try { decodeURIComponent(x) } catch {}`.",
]

[[construct]]
id = "zod-schema"
title = "zod schema"
query = '''
(call_expression
  function: (member_expression object: (identifier) @z (#eq? @z "z"))) @match
'''
rust = "`#[derive(Deserialize)]` types with `#[serde(deny_unknown_fields)]` where zod used `.strict()`, plus explicit validation fns for refinements. `schemars` if a JSON Schema is emitted."
hazards = [
  "zod `.default()`, `.transform()`, `.coerce`, and `.passthrough()` each need a deliberate serde equivalent; error messages are part of the CLI contract when they reach stderr.",
  "zod `.optional()` rejects an explicit JSON `null`, but serde's `Option<T>` decodes `null` as `None`. On a decode boundary that must reject what zod rejects (journals, wire messages), reject `null` for every `.optional()` field that is not `.nullable()`.",
  "`z.number().int()` accepts whole-number floats (`3.0`) because JS has one number type; deserializing straight into `i64` rejects them. Deserialize as `f64` first and check it is a finite whole number in range.",
  "`serde_json::to_string` is not `JSON.stringify` for numbers: it writes `1.0` and `-0.0` where JS writes `1` and `0`. Where the serialized text is compared, hashed, measured (`.length`), or sent, write a JS-exact stringifier helper (one for `Value`, one for typed structs) and use it instead of serde_json.",
]

# ─── Errors ───────────────────────────────────────────────────────────────

[[construct]]
id = "commander-command-tree"
title = "Commander command tree with .action() callbacks"
query = '''
(call_expression
  function: (member_expression property: (property_identifier) @prop)
  (#eq? @prop "action")) @match
'''
rust = "clap `Command`/`Arg` hold no behavior, so split a TS factory that builds a subcommand tree and binds `.action()`s into `create_x_commands(...) -> clap::Command` (structure only; take exactly what the TS construction reads) and `run_x_command(cli, opts, matches: &ArgMatches) -> Result<i32, XCommandError>` (dispatch on `matches.subcommand()` and run each action). `XCommandError` is a per-module `thiserror` enum with `#[from]` variants plus `Other(#[from] anyhow::Error)`; `Ok(code)` carries `process.exitCode` (0 when TS never sets it)."
hazards = [
  "A Commander command with subcommands but no `.action()` prints usage and exits 1 on a bare invocation without running `preAction` hooks; set `.subcommand_required(true)` on it. A command with both an action and subcommands runs its action when none is given.",
  "`.hook(\"preAction\", ...)` runs before the leaf action only; call the guard at the top of each leaf's dispatch arm, not in the parent.",
]

[[construct]]
id = "commander-root-option"
title = "Walking to the root Command for a global option"
query = '''
(while_statement
  condition: (parenthesized_expression
    (member_expression property: (property_identifier) @prop))
  (#eq? @prop "parent")) @match
'''
rust = "`while (root.parent) root = root.parent; root.opts().x` reads a global option from whatever program embeds the subcommand. A self-contained `run_x_command` has no root to walk; take the resolved value as an explicit `global_x: Option<&str>` parameter that the binary's dispatcher reads from the top-level `ArgMatches`. Apply the same TS truthiness to it."

