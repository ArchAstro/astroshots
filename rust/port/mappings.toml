notes = "React's `useState(factory)` + `useSyncExternalStore(subscribe, snapshot, snapshot)` hook pair has no per-call Rust equivalent: port `useState`'s factory argument as the store type's constructor, with the *caller's* screen state struct owning one instance as a field (the `useState` slot); port the hook function itself as a thin forwarding call (`store.observe(...)`) taking `&Store` as an explicit parameter, not synthesized hook-local persistent state. `useSyncExternalStore`'s subscribe/re-render wiring is left for the screen struct that will own the store, ported when that screen (the hook's actual caller) is ported. Per-hook rules live in your terminal UI component library's mapping (see components.toml)."

