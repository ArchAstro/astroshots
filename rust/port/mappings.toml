rust = "`std::fs` (sync call sites) or `tokio::fs` (inside async code)"
notes = "Atomic writes (write temp + rename) must stay atomic: `tempfile::NamedTempFile::persist`. `fs.rmSync({recursive,force})` → `std::fs::remove_dir_all` ignoring NotFound. `fs.readdir`/`readdirSync`/`fs.promises.readdir` return names byte-sorted (libuv sorts scandir with strcmp); `read_dir` returns raw OS order. Wherever order is observable (output, first match, truncation cap, tie-break in a later stable sort), sort with a byte-order helper (`sort_like_readdir`) before use; test with names whose OS order is scrambled (e.g. `beta zeta 9 10 é _x Alpha e`), since simple lowercase pairs often come back sorted on APFS."

