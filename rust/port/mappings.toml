[[package]]
npm = "proper-lockfile"
rust = "advisory file locks"
notes = "The `crates = [\"fs4\"]` this entry used to suggest was actively misleading: fs4 is flock-based, but proper-lockfile uses a `<file>.lock` directory with mtime staleness, and other versions of the program may share that on-disk protocol during upgrade windows, so keep it rather than switching to flock. Hand-roll it: mkdir the lock path, reclaim on `mtime` older than `stale`, back off retries per the `{retries,factor,minTimeout,maxTimeout}` shape (the `retry` npm package's shape), keep a held lock fresh with a background mtime touch every `update`, and report a failed touch through a lock-compromised guard. When several modules call this protocol, implement it exactly once as a shared `pub(crate)` module rather than re-deriving equivalent-but-subtly-different logic per call site. A call that omits `retries` gets proper-lockfile's default of zero retries: fail at once with `ELOCKED` when a fresh lock is held. A TS test that spies on the npm module's exported function (`vi.spyOn(lockfile.lock, ...).mockImplementation(...)`) to inject a mid-operation failure has no monkey-patch equivalent once reimplemented in-crate; port it as a `#[cfg(test)]`-only internal seam that fires the exact same failure signal (e.g. the lock-compromise guard's `on_compromised`) at the identical point in the real code path, and document why the seam exists in place of the TS spy."

